name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest

  trivy:
    name: Dependency vulnerability scan (warn-only)
    # trivy-action is a Docker container action and only runs on Linux
    # runners -- kept as its own job on ubuntu-latest rather than a step
    # bolted onto the windows-latest test job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WARN-ONLY on purpose: this is the first run, so the baseline is
      # unknown -- gating now would block every build on findings nobody
      # has triaged yet.
      #
      # To gate later: drop continue-on-error, set exit-code to "1", and add
      # a .trivyignore entry for any accepted-risk CVE with a dated rationale.
      - name: Dependency vulnerability scan (warn-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
