[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-digest"
version = "0.1.0"
description = "Turn a video (URL or local mp4) into keyframes + transcript + a structured markdown digest. Fully local, $0."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "faster-whisper",
    "requests",
    # Keyframe colour analysis (video_digest/visual.py). Pillow decodes the JPEGs
    # ffmpeg writes; numpy does the palette/histogram math. Both are local-only and
    # model-free, so the "$0, fully local" guarantee is unchanged. numpy is already
    # pulled in transitively by faster-whisper -> ctranslate2, but this module
    # imports it directly, so it is declared directly.
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["video_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
